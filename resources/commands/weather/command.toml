[[commands]]
id = "weather"
type = "lua"
description = "Say current weather"
script = "script.lua"
sandbox = "standard"
timeout = 10000

[commands.phrases]
ru = ["какая погода", "что с погодой", "погода на улице", "скажи погоду", "какая сейчас погода"]
en = ["what's the weather", "weather now"]


[[commands]]
id = "set_city"
type = "lua"
description = "Set city for weather"
script = "set_city.lua"
sandbox = "standard"
timeout = 5000

[commands.phrases]
ru = ["установи город", "поменяй город", "смени город"]
en = ["set city", "change city"]
