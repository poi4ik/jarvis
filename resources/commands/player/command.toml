[[commands]]
id = "player_video"
type = "cli"
description = "Play ~/Видео fullscreen in mpv"
cli_cmd = "python3"
cli_args = ["scripts/mpv_control.py", "video"]

[commands.phrases]
ru = [
  "включи видео",
  "включи фильм",
  "запусти видео",
  "покажи видео",
  "включи кино",
]
en = [
  "play video",
  "play movie",
]


[[commands]]
id = "player_music"
type = "cli"
description = "Play ~/Музыка in mpv (audio only, shuffled)"
cli_cmd = "python3"
cli_args = ["scripts/mpv_control.py", "music"]

[commands.phrases]
ru = [
  "включи музыку",
  "запусти музыку",
  "поставь музыку",
  "включи песни",
]
en = [
  "play music",
]


